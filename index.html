<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tocadiscos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <h1>Tocadiscos</h1>

    <div class="player">

      <div class="turntable">
        <div class="turntable-body">

          <div class="vinyl" id="vinyl">
            <div class="vinyl-grooves"></div>
            <div class="vinyl-label" id="vinylLabel">
              <svg id="albumIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
              </svg>
            </div>
            <div class="vinyl-hole"></div>
          </div>

          <div class="rest-peg"></div>

          <div class="tonearm" id="tonearm">
            <div class="tonearm-pivot"></div>
            <div class="tonearm-stick">
              <div class="tonearm-head"></div>
            </div>
          </div>

          <div class="power-light" id="powerLight"></div>
        </div>
      </div>

      <div class="track-info">
        <h2 id="trackTitle">Sin canción cargada</h2>
        <p id="trackArtist">Sube uno o varios MP3 para empezar</p>
      </div>

      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="prevBtn" class="icon-btn" title="Anterior" aria-label="Anterior">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="playPauseBtn" title="Reproducir" aria-label="Reproducir/Pausar">
          <svg class="icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button id="nextBtn" class="icon-btn" title="Siguiente" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18V6z"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z"/></svg>
        <input type="range" id="volumeBar" value="80" min="0" max="100" aria-label="Volumen">
      </div>

      <label for="fileInput" class="upload-btn">Elegir canciones</label>
      <input type="file" id="fileInput" accept="audio/*" multiple hidden>
    </div>

    <div class="playlist">
      <h3>Lista de reproducción</h3>
      <ul id="playlistItems"><li class="empty-hint">Aún no subiste canciones</li></ul>
    </div>
  </div>

  <audio id="audio"></audio>

  <script src="js/app.js"></script>
</body>
</html>
